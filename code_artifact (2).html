<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For FRDIDA | You Are My Only One</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #030104;
            color: #fce7f3;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-serif-custom {
            font-family: 'Cormorant Garamond', serif;
        }

        /* Ambient Canvases */
        #petal-canvas, #sparkle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #petal-canvas { z-index: 5; }
        #sparkle-canvas { z-index: 2; }

        /* Luxury Dark Glassmorphism */
        .glass-card {
            background: rgba(10, 3, 8, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(225, 29, 72, 0.2);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Glowing Background Orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 1;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.35; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.18); }
        }

        /* Rose Container & Subtle Breath Animation */
        .rose-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            animation: floatRose 6s ease-in-out infinite alternate;
        }
        .rose-wrapper:hover {
            transform: scale(1.05) rotate(1deg);
        }

        @keyframes floatRose {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(1.5deg); }
        }

        /* Velvet Rose Glow Filter */
        .rose-svg-glow {
            filter: drop-shadow(0 0 30px rgba(225, 29, 72, 0.6)) drop-shadow(0 0 60px rgba(159, 18, 57, 0.4));
            transition: filter 0.6s ease;
        }
        .rose-wrapper:hover .rose-svg-glow {
            filter: drop-shadow(0 0 45px rgba(244, 63, 94, 0.9)) drop-shadow(0 0 85px rgba(225, 29, 72, 0.7));
        }

        /* Shimmering Luxury Button */
        .btn-luxury {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #881337 100%);
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-luxury:hover {
            box-shadow: 0 0 55px rgba(244, 63, 94, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between items-center relative p-4 md:p-8 select-none">

    <!-- Falling Petals & Ambient Sparkles -->
    <canvas id="sparkle-canvas"></canvas>
    <canvas id="petal-canvas"></canvas>

    <!-- Deep Romantic Ambient Glows -->
    <div class="glow-orb w-[650px] h-[650px] bg-rose-950/40 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="glow-orb w-[380px] h-[380px] bg-red-900/25 top-1/4 left-1/4" style="animation-delay: -3s;"></div>
    <div class="glow-orb w-[320px] h-[320px] bg-pink-950/30 bottom-1/4 right-1/4" style="animation-delay: -5s;"></div>

    <!-- Header / Brand -->
    <header class="w-full max-w-lg flex justify-center items-center z-20 pt-3 px-2">
        <div class="flex items-center space-x-2 text-rose-300/70 text-[11px] tracking-[0.3em] uppercase font-light">
            <i class="fa-solid fa-sparkles text-rose-400 text-[10px]"></i>
            <span>FOR MY DEAREST FRDIDA</span>
            <i class="fa-solid fa-sparkles text-rose-400 text-[10px]"></i>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-lg flex flex-col items-center justify-center z-20 my-auto text-center py-4">
        
        <!-- Ultra-Detailed Photorealistic Vector Red Rose -->
        <div class="rose-wrapper my-2" title="My Heart For FRDIDA">
            <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
                
                <!-- Ambient Bloom Aura behind Rose -->
                <div class="absolute inset-0 bg-gradient-to-tr from-rose-600/25 via-red-500/35 to-pink-500/15 rounded-full blur-3xl"></div>

                <svg class="w-full h-full rose-svg-glow" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Radial Velvet Petal Gradients -->
                        <radialGradient id="roseCore" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ff1e4b"/>
                            <stop offset="40%" stop-color="#cc0029"/>
                            <stop offset="75%" stop-color="#7a0016"/>
                            <stop offset="100%" stop-color="#330008"/>
                        </radialGradient>

                        <radialGradient id="petalHigh" cx="35%" cy="30%" r="65%">
                            <stop offset="0%" stop-color="#ff4d73"/>
                            <stop offset="30%" stop-color="#e60033"/>
                            <stop offset="70%" stop-color="#990022"/>
                            <stop offset="100%" stop-color="#4d0011"/>
                        </radialGradient>

                        <linearGradient id="petalShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff335c"/>
                            <stop offset="50%" stop-color="#b30024"/>
                            <stop offset="100%" stop-color="#260006"/>
                        </linearGradient>

                        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2d6a4f"/>
                            <stop offset="50%" stop-color="#1b4332"/>
                            <stop offset="100%" stop-color="#081c15"/>
                        </linearGradient>

                        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#52b788"/>
                            <stop offset="50%" stop-color="#2d6a4f"/>
                            <stop offset="100%" stop-color="#081c15"/>
                        </linearGradient>

                        <!-- Soft Drop Shadows for Depth -->
                        <filter id="petalShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
                        </filter>
                    </defs>

                    <!-- Stem & Leaves -->
                    <path d="M250 320 C245 370 255 430 260 480" stroke="url(#stemGrad)" stroke-width="10" stroke-linecap="round"/>
                    
                    <!-- Left Leaf -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M248 390 C200 380 150 400 130 420 C160 435 220 425 248 398 Z" fill="url(#leafGrad)"/>
                        <path d="M248 390 C200 395 150 410 130 420" stroke="#74c69d" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
                    </g>
                    
                    <!-- Right Leaf -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M252 360 C300 345 350 355 375 370 C345 390 285 390 252 366 Z" fill="url(#leafGrad)"/>
                        <path d="M252 360 C300 360 350 365 375 370" stroke="#74c69d" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
                    </g>

                    <!-- Sepals (Green Base Leaves under Bloom) -->
                    <path d="M220 325 C230 340 240 350 250 352 C260 350 270 340 280 325 C265 330 235 330 220 325 Z" fill="#1b4332"/>

                    <!-- Outer Large Petals (Layer 1) -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M250 110 C140 100 80 200 120 300 C170 360 330 360 380 300 C420 200 360 100 250 110 Z" fill="url(#petalShadow)"/>
                    </g>

                    <!-- Outer Curved Petal Edges (Layer 2) -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M120 240 C100 180 160 120 230 130 C200 170 150 210 120 240 Z" fill="url(#petalHigh)"/>
                        <path d="M380 240 C400 180 340 120 270 130 C300 170 350 210 380 240 Z" fill="url(#petalHigh)"/>
                        <path d="M170 320 C210 360 290 360 330 320 C290 335 210 335 170 320 Z" fill="url(#petalHigh)"/>
                    </g>

                    <!-- Mid Petal Layers (Layer 3) -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M150 200 C140 140 210 130 250 150 C290 130 360 140 350 200 C340 260 290 300 250 305 C210 300 160 260 150 200 Z" fill="url(#roseCore)"/>
                    </g>

                    <g filter="url(#petalShadowFilter)">
                        <path d="M170 190 C180 150 230 150 250 170 C270 150 320 150 330 190 C320 240 280 270 250 275 C220 270 180 240 170 190 Z" fill="url(#petalHigh)"/>
                    </g>

                    <!-- Inner Blooming Heart (Layer 4) -->
                    <g filter="url(#petalShadowFilter)">
                        <path d="M200 195 C200 170 230 165 250 180 C270 165 300 170 300 195 C295 230 270 245 250 248 C230 245 205 230 200 195 Z" fill="url(#roseCore)"/>
                    </g>

                    <!-- Tightly Folded Rose Center Bud -->
                    <path d="M225 190 C225 175 240 172 250 182 C260 172 275 175 275 190 C270 212 258 222 250 224 C242 222 230 212 225 190 Z" fill="url(#petalHigh)"/>
                    <path d="M238 186 C242 178 250 178 252 186 C250 198 244 198 238 186 Z" fill="#ff1e4b"/>

                    <!-- Dew Drops / Highlights on Petals -->
                    <ellipse cx="210" cy="260" rx="3" ry="2" fill="#ffffff" opacity="0.6"/>
                    <ellipse cx="300" cy="240" rx="4" ry="2.5" fill="#ffffff" opacity="0.7" transform="rotate(-15 300 240)"/>
                    <ellipse cx="250" cy="140" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.5"/>
                </svg>
            </div>
        </div>

        <!-- Glassmorphism Card with Concise English Message -->
        <div class="glass-card w-full rounded-3xl p-6 md:p-8 border border-rose-500/20 mt-3">
            <h1 class="text-3xl md:text-5xl font-light font-serif-custom text-transparent bg-clip-text bg-gradient-to-r from-rose-100 via-pink-200 to-rose-300 tracking-wide mb-3">
                Dearest FRDIDA,
            </h1>

            <p class="text-sm md:text-base text-rose-100/90 font-serif-custom italic font-light leading-relaxed max-w-md mx-auto mb-6">
                "I am deeply sorry for making you feel uncomfortable. You mean everything to me, and my heart belongs strictly to you, FRDIDA."
            </p>

            <!-- Action Button -->
            <button id="accept-btn" onclick="acceptApology()" class="btn-luxury px-8 py-3.5 text-white font-light tracking-[0.18em] text-xs uppercase rounded-full flex items-center justify-center gap-2.5 mx-auto cursor-pointer">
                <i class="fa-solid fa-heart text-sm text-rose-200"></i>
                <span>Forgive Me ❤️</span>
            </button>
        </div>

    </main>

    <!-- Forgiveness Confirmation Overlay -->
    <div id="success-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-2xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-700 p-6">
        <div class="text-center space-y-5 max-w-md p-8 glass-card rounded-3xl border border-rose-500/30 shadow-2xl">
            <div class="w-20 h-20 bg-rose-600/20 rounded-full flex items-center justify-center mx-auto border border-rose-400/40">
                <i class="fa-solid fa-sparkles text-3xl text-rose-300 animate-pulse"></i>
            </div>
            <h2 class="text-3xl font-serif-custom text-pink-100">Thank you for forgiving me, FRDIDA ❤️</h2>
            <p class="text-rose-200/80 text-sm font-serif-custom italic font-light">
                I promise to cherish and protect your heart forever, my love.
            </p>
            <div class="pt-2">
                <button onclick="closeOverlay()" class="px-6 py-2.5 bg-rose-950/60 hover:bg-rose-900/60 text-rose-200 font-light rounded-full border border-rose-500/30 transition text-xs tracking-widest uppercase">
                    Keep This Rose
                </button>
            </div>
        </div>
    </div>

    <!-- Minimal Luxury Footer -->
    <footer class="text-center text-[10px] text-rose-300/30 z-20 mt-2 tracking-[0.25em] uppercase font-light">
        Forever & Always • FRDIDA
    </footer>

    <!-- Interactive Canvas & Particle Script (No Sound/Audio) -->
    <script>
        // --- 1. Ambient Falling Rose Petals Canvas ---
        const pCanvas = document.getElementById('petal-canvas');
        const pCtx = pCanvas.getContext('2d');

        function resizePetalCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizePetalCanvas);
        resizePetalCanvas();

        const fallingPetals = [];
        const petalCount = 28;

        class Petal2D {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * pCanvas.width;
                this.y = Math.random() * -pCanvas.height;
                this.size = Math.random() * 9 + 6;
                this.speedY = Math.random() * 1.0 + 0.6;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 1.2 - 0.6;
                this.opacity = Math.random() * 0.5 + 0.35;
                this.color = Math.random() > 0.4 ? '#e11d48' : '#be123c';
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.008) + this.speedX;
                this.angle += this.spin;
                if (this.y > pCanvas.height + 20) { this.reset(); }
            }
            draw() {
                pCtx.save();
                pCtx.translate(this.x, this.y);
                pCtx.rotate((this.angle * Math.PI) / 180);
                pCtx.globalAlpha = this.opacity;
                pCtx.fillStyle = this.color;
                pCtx.beginPath();
                pCtx.moveTo(0, 0);
                pCtx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
                pCtx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
                pCtx.fill();
                pCtx.restore();
            }
        }

        for (let i = 0; i < petalCount; i++) {
            fallingPetals.push(new Petal2D());
        }

        function renderPetals() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            fallingPetals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(renderPetals);
        }
        renderPetals();

        // --- 2. Floating Sparkles Background Canvas ---
        const sCanvas = document.getElementById('sparkle-canvas');
        const sCtx = sCanvas.getContext('2d');

        function resizeSparkleCanvas() {
            sCanvas.width = window.innerWidth;
            sCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSparkleCanvas);
        resizeSparkleCanvas();

        const sparkles = [];
        const sparkleCount = 45;

        class Sparkle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * sCanvas.width;
                this.y = Math.random() * sCanvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.015 + 0.005;
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
            }
            draw() {
                sCtx.save();
                sCtx.globalAlpha = Math.abs(this.alpha);
                sCtx.fillStyle = '#fbcfe8';
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();
            }
        }

        for (let i = 0; i < sparkleCount; i++) sparkles.push(new Sparkle());

        function renderSparkles() {
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            sparkles.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(renderSparkles);
        }
        renderSparkles();

        // --- 3. Forgiveness Celebration (Confetti & Overlay) ---
        function acceptApology() {
            const duration = 3.5 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 },
                    colors: ['#e11d48', '#f43f5e', '#fb7185', '#ffffff']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 },
                    colors: ['#e11d48', '#f43f5e', '#fb7185', '#ffffff']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            })();

            setTimeout(() => {
                const overlay = document.getElementById('success-overlay');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            }, 600);
        }

        function closeOverlay() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
